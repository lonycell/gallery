<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>대쉬 챗</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column;
        font-family: -apple-system, "Noto Sans KR", system-ui, sans-serif;
        background: #140A2B; color: #fff;
      }
      header {
        padding: 14px 16px; font-weight: 700; font-size: 16px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      header a { color: rgba(255,255,255,0.6); text-decoration: none; font-weight: 400; font-size: 14px; }
      #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
      .user { align-self: flex-end; background: linear-gradient(90deg, #7C4DFF, #E15BD0); }
      .ai { align-self: flex-start; background: rgba(255,255,255,0.14); }
      form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid rgba(255,255,255,0.08); }
      input {
        flex: 1; border: none; border-radius: 22px; padding: 12px 16px; font-size: 15px;
        background: rgba(255,255,255,0.14); color: #fff; outline: none;
      }
      button {
        border: none; border-radius: 22px; padding: 0 18px; font-size: 15px; font-weight: 700;
        background: linear-gradient(90deg, #7C4DFF, #E15BD0); color: #fff;
      }
      button:disabled { opacity: 0.5; }
    </style>
  </head>
  <body>
    <header><a href="index.html">‹ 목록</a> &nbsp; <span id="title">대화</span></header>
    <div id="log"></div>
    <form id="form">
      <input id="input" type="text" placeholder="메시지를 입력하세요…" autocomplete="off" />
      <button id="send" type="submit">전송</button>
    </form>

    <script src="dashchat.js"></script>
    <script>
      function qs(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
        return m ? decodeURIComponent(m[1]) : '';
      }
      var topicTitle = qs('title') || '대화';
      document.getElementById('title').textContent = topicTitle;

      var log = document.getElementById('log');
      var input = document.getElementById('input');
      var sendBtn = document.getElementById('send');
      var form = document.getElementById('form');

      function addMsg(cls, text) {
        var d = document.createElement('div');
        d.className = 'msg ' + cls;
        d.textContent = text;
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
        return d;
      }

      if (!DashChat.isReady()) {
        addMsg('ai', 'AI 모델이 아직 준비되지 않았어요. 앱에서 모델을 먼저 준비한 뒤 다시 시도해 주세요.');
      } else {
        addMsg('ai', topicTitle + ' 시작해 볼까요? 편하게 말 걸어주세요.');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var prompt = input.value.trim();
        if (!prompt) return;
        addMsg('user', prompt);
        input.value = '';
        sendBtn.disabled = true;

        var aiBubble = addMsg('ai', '');
        DashChat.chat(prompt, function (delta, soFar) {
          aiBubble.textContent = soFar;
          log.scrollTop = log.scrollHeight;
        }).then(function (full) {
          aiBubble.textContent = full;
          sendBtn.disabled = false;
          input.focus();
          log.scrollTop = log.scrollHeight;
        }).catch(function (err) {
          aiBubble.textContent = '⚠ ' + (err && err.message ? err.message : '오류가 발생했어요.');
          sendBtn.disabled = false;
        });
      });
    </script>
  </body>
</html>
