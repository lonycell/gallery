# XcodeGen spec (alternative to the checked-in Gallery.xcodeproj).
# Run `xcodegen generate` in this directory to regenerate the project from the
# source tree. Mirrors the Android Gradle module `app` (com.google.aiedge.gallery),
# repackaged under the kr.co.utopsoft.aiedge.gallery identity.
name: Gallery
options:
  bundleIdPrefix: kr.co.utopsoft.aiedge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.15"      # = Android versionName
    CURRENT_PROJECT_VERSION: "33"    # = Android versionCode
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: ko
targets:
  # Target/product name must stay ASCII so build folders (e.g. Gallery.app,
  # Gallery.build) contain no Korean. The Korean display name is preserved via
  # CFBundleDisplayName / CFBundleName in Gallery/Info.plist.
  Gallery:
    type: application
    platform: iOS
    sources:
      - path: Gallery
        excludes:
          - "Info.plist"
          - "Gallery.entitlements"
          # Added below as folder references so their directory structure is
          # preserved in the bundle (avoids "Multiple commands produce
          # SKILL.md / index.html" flattening collisions).
          - "Resources/skills"
          - "Resources/tinygarden"
      - path: Gallery/Resources/skills
        type: folder
      - path: Gallery/Resources/tinygarden
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.utopsoft.aiedge.gallery
        PRODUCT_NAME: Gallery
        INFOPLIST_FILE: Gallery/Info.plist
        CODE_SIGN_ENTITLEMENTS: Gallery/Gallery.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
